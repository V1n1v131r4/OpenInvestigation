services:
  osint:
    build: .
    ports:
      - "127.0.0.1:${OSINT_PORT:-8080}:8080"
    environment:
      OSINT_SEARCH_URL: "${OSINT_SEARCH_URL-http://search:8080/search}"
      MWMBL_API_KEY: "${MWMBL_API_KEY:-}"
      OSINT_LLM: "${OSINT_LLM:-1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OSINT_OPENAI_MODEL: "${OSINT_OPENAI_MODEL-gpt-5-mini}"
      OSINT_ANTHROPIC_MODEL: "${OSINT_ANTHROPIC_MODEL-claude-sonnet-4-6}"
      OSINT_WEB: "${OSINT_WEB:-1}"
      VIRUSTOTAL_API_KEY: "${VIRUSTOTAL_API_KEY:-}"
      SHODAN_API_KEY: "${SHODAN_API_KEY:-}"
      RANSOMWARE_LIVE_API_KEY: "${RANSOMWARE_LIVE_API_KEY:-}"
      THREATFOX_AUTH_KEY: "${THREATFOX_AUTH_KEY:-}"
      OTX_API_KEY: "${OTX_API_KEY:-}"
      GREYNOISE_API_KEY: "${GREYNOISE_API_KEY:-}"
      URLSCAN_API_KEY: "${URLSCAN_API_KEY:-}"
      CENSYS_API_ID: "${CENSYS_API_ID:-}"
      CENSYS_API_SECRET: "${CENSYS_API_SECRET:-}"
      CIRCL_PDNS_USER: "${CIRCL_PDNS_USER:-}"
      CIRCL_PDNS_PASSWORD: "${CIRCL_PDNS_PASSWORD:-}"
    volumes:
      - cases:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    init: true

  search:
    image: ghcr.io/searxng/searxng:latest
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export SEARXNG_SECRET="$$(od -An -N32 -tx1 /dev/urandom | tr -d '[:space:]')"
        exec /usr/local/searxng/entrypoint.sh
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/osint-settings.yml
      FORCE_OWNERSHIP: "false"
      GRANIAN_PORT: "8080"
    volumes:
      - ./searxng.yml:/etc/searxng/osint-settings.yml:ro
    init: true

volumes:
  cases:
